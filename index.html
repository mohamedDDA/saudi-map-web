<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>خريطة المملكة العربية السعودية التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* ===== Tokens ===== */
:root{
  --green:#0b4a3a; --green-2:#14654f; --ink:#1d2a26; --paper:#f7f6f1;
  --sand:#c8b98c; --gray:#6b746f; --line:#dedbd0; --danger:#a63d2f;
  --r:14px; --shadow:0 6px 24px rgba(11,74,58,.18);
  --vh:1vh; --top:max(12px,env(safe-area-inset-top));
  --side:max(12px,env(safe-area-inset-right)); --side-l:max(12px,env(safe-area-inset-left));
  --bot:max(12px,env(safe-area-inset-bottom));
  font-family:"Tajawal","IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e9e6da;color:var(--ink);-webkit-text-size-adjust:100%}
body{height:100vh;height:calc(var(--vh)*100);height:100dvh;position:relative}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}

/* ===== Map ===== */
#map{position:absolute;top:0;left:0;right:0;bottom:0;direction:ltr;background:#e9e6da}
.leaflet-container{font-family:inherit}
.map-msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:900;background:rgba(247,246,241,.95);font-weight:700;line-height:1.9}
.map-msg.on{display:flex}

/* ===== Header ===== */
.bar{position:absolute;z-index:800;top:var(--top);right:var(--side);left:var(--side-l);display:flex;gap:10px;align-items:stretch;pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--green);color:#fff;border-radius:var(--r);padding:8px 16px 8px 14px;box-shadow:var(--shadow);flex:0 0 auto}
.brand svg{width:30px;height:30px;flex:0 0 auto}
.brand b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:12px;color:#cfe3da;line-height:1.2}
.search{position:relative;flex:1 1 auto;max-width:520px}
.search form{margin:0;display:flex;align-items:center;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);height:100%}
.search input{flex:1;min-width:0;height:48px;border:0;background:transparent;padding:0 14px;font-size:16px;outline:none}
.search button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--green)}
.results{position:absolute;top:calc(100% + 6px);right:0;left:0;margin:0;padding:6px;list-style:none;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);max-height:50vh;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.results.on{display:block}
.results li{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.5}
.results li:hover,.results li:focus{background:#ebe8db}
.results li small{display:block;color:var(--gray);font-size:12.5px}
.results .none{cursor:default;color:var(--gray)}

/* ===== Controls ===== */
.ctrls{position:absolute;z-index:700;left:var(--side-l);top:calc(var(--top) + 70px);display:flex;flex-direction:column;gap:8px}
.grp{display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.grp button,.single{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--green);transition:background .15s}
.grp button+button{border-top:1px solid var(--line)}
.single{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.grp button:hover,.single:hover{background:#ebe8db}
.single.active{background:var(--green);color:#fff}
.ctrls svg,.search svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Details panel ===== */
.panel{position:absolute;z-index:750;right:var(--side);top:calc(var(--top) + 70px);width:340px;max-height:calc(100vh - var(--top) - var(--bot) - 80px);max-height:calc(var(--vh)*100 - var(--top) - var(--bot) - 80px);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);display:none;flex-direction:column;overflow:hidden}
.panel.on{display:flex}
.panel-h{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 10px;background:var(--green);color:#fff}
.panel-h h2{margin:0;flex:1;font-size:18px;font-weight:800;line-height:1.4}
.panel-h button{width:34px;height:34px;border-radius:50%;color:#fff;font-size:20px;line-height:1;background:rgba(255,255,255,.14)}
.panel-b{padding:6px 16px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.row{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6}
.row:last-child{border-bottom:0}
.row span{display:block;font-size:12.5px;color:var(--gray)}
.row .ltr{direction:ltr;text-align:right;unicode-bidi:plaintext}
.panel a.btn{display:block;text-align:center;margin-top:8px;padding:11px;background:var(--green);color:#fff;border-radius:10px;text-decoration:none;font-weight:700}
.panel .tools{display:flex;gap:8px}
.panel .tools button{flex:1;margin-top:8px;padding:11px;border:1px solid var(--green);border-radius:10px;color:var(--green);font-weight:700}

/* ===== Directions ===== */
.modes{display:flex;gap:6px;margin:8px 0}
.modes button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;font-weight:700;color:var(--green)}
.modes button.on{background:var(--green);color:#fff;border-color:var(--green)}
.pt{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pt b,.wp{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pf{position:relative;flex:1;min-width:0}
.pf input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-size:15px}
.pt button{height:40px;padding:0 8px;border:1px solid var(--green);border-radius:10px;color:var(--green);font-size:13px;font-weight:700;white-space:nowrap}
.pf .results{z-index:5}
.rt{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;background:#fff;font-size:15px}
.rt.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.rt em{font-style:normal;font-size:12px;background:var(--sand);color:var(--ink);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.st{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.st small{color:var(--gray);white-space:nowrap}
.hint{font-size:13px;color:var(--gray);margin:4px 0}

/* ===== Services / offline ===== */
html,body{-webkit-tap-highlight-color:transparent}
.panel-b h3{margin:14px 0 4px;font-size:15px;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:14px}
.pr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.pr.next{font-weight:800;color:var(--green)}
.sv{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.sv span{flex:1;cursor:pointer}
.sv button{color:var(--danger);font-size:20px;padding:0 8px}
.act{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--green);border-radius:10px;color:var(--green);font-weight:700;background:#fff}
.act.pri{background:var(--green);color:#fff}
.act:disabled{opacity:.5}
.rg{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.rg label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.rg input{width:20px;height:20px;flex:none}
.rg .ok{width:20px;flex:none;text-align:center;color:var(--green);font-weight:800}
.rg .rn{font-weight:700}
.rg small{color:var(--gray);font-size:12.5px;white-space:nowrap}
.rg button{color:var(--danger);font-size:22px;padding:0 8px}
.rg.full{background:var(--sand);margin:0 -6px;padding:8px 6px;border-radius:8px}
.pill{position:absolute;z-index:790;top:calc(var(--top) + 64px);left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;border-radius:999px;padding:4px 14px;font-size:13px;display:none}
.pill.on{display:block}

/* ===== Toast ===== */
.toast{position:absolute;z-index:950;left:50%;bottom:var(--bot);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;max-width:90%;text-align:center;display:none}
.toast.on{display:block}

/* ===== Marker ===== */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--green);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transform:rotate(-45deg)}
.me{width:16px;height:16px;border-radius:50%;background:#2a7de1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,125,225,.25)}
.leaflet-control-attribution{font-size:11px;direction:ltr}

/* ===== Responsive ===== */
@media (max-width:720px){
  .brand small{display:none}
  .brand{padding:8px 12px}
  .brand b{font-size:15px}
  .search{max-width:none}
  .panel{top:auto;right:var(--side);left:var(--side);bottom:var(--bot);width:auto;max-height:46vh;max-height:calc(var(--vh)*46)}
  .ctrls{top:calc(var(--top) + 66px)}
}
@media (max-width:480px){ .brand b{display:none} .brand{padding:8px} }
@media (max-height:480px) and (orientation:landscape){
  .brand small{display:none}
  .brand,.search input,.search button{height:42px}
  .search input{height:42px}.search button{height:42px}
  .brand{padding:4px 12px}
  .ctrls{top:calc(var(--top) + 54px);flex-direction:row;left:var(--side-l)}
  .grp{flex-direction:row}.grp button+button{border-top:0;border-right:1px solid var(--line)}
  .grp button,.single{width:42px;height:42px}
  .panel{top:calc(var(--top) + 54px);bottom:var(--bot);right:var(--side);left:auto;width:min(320px,45vw);max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="map" aria-label="خريطة المملكة العربية السعودية"></div>
<div class="map-msg" id="mapMsg" role="alert"></div>

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#fff"/><path d="M16 5l2.6 6.2 6.6.6-5 4.4 1.5 6.5L16 19.4 10.3 22.7l1.5-6.5-5-4.4 6.6-.6z" fill="#0b4a3a"/></svg>
    <div><b>خريطة المملكة</b><small>المملكة العربية السعودية</small></div>
  </div>
  <div class="search">
    <form id="sForm" role="search" autocomplete="off">
      <input id="sInput" type="search" placeholder="ابحث عن مدينة أو حي أو شارع أو معلم" aria-label="بحث في الخريطة">
      <button type="submit" aria-label="بحث"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </form>
    <ul class="results" id="results" role="listbox"></ul>
  </div>
</header>

<div class="ctrls">
  <div class="grp">
    <button id="zIn" type="button" aria-label="تكبير"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zOut" type="button" aria-label="تصغير"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
  <button class="single" id="home" type="button" aria-label="العودة إلى المملكة" title="العودة إلى المملكة"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button class="single" id="locate" type="button" aria-label="موقعي الحالي" title="موقعي الحالي"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="single" id="dirBtn" type="button" aria-label="الاتجاهات" title="الاتجاهات"><svg viewBox="0 0 24 24"><path d="M6 20V10a4 4 0 0 1 4-4h9M15 2l4 4-4 4"/></svg></button>
  <button class="single" id="svcBtn" type="button" aria-label="الأدوات" title="المفضلة والمدن والخرائط دون إنترنت"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
  <button class="single" id="layer" type="button" aria-label="تبديل نمط الخريطة" title="خريطة / صور أقمار صناعية"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg></button>
</div>

<aside class="panel" id="svc">
  <div class="panel-h"><h2>الأدوات</h2><button id="svClose" type="button" aria-label="إغلاق">&times;</button></div>
  <div class="panel-b" id="svcBody"></div>
</aside>

<aside class="panel" id="dir">
  <div class="panel-h"><h2>الاتجاهات</h2><button id="dClose" type="button" aria-label="إغلاق">&times;</button></div>
  <div class="panel-b">
    <div class="modes" id="modes"><button type="button" data-m="foot" class="on">مشي</button><button type="button" data-m="car">سيارة</button><button type="button" data-m="bike">دراجة</button></div>
    <div id="pts"></div>
    <div class="tools"><button type="button" id="addStop">+ محطة</button><button type="button" id="swap">عكس الاتجاه</button></div>
    <div id="routes"></div><div id="steps"></div>
  </div>
</aside>

<aside class="panel" id="panel" aria-live="polite">
  <div class="panel-h"><h2 id="pTitle"></h2><button id="pClose" type="button" aria-label="إغلاق">&times;</button></div>
  <div class="panel-b" id="pBody"></div>
</aside>

<div class="pill" id="offl" role="status">دون اتصال بالإنترنت</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  'use strict';
  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast on';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast'; }, 3500);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // Fixes 100vh on mobile browsers with collapsing address bars
  function setVh() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
  setVh(); window.addEventListener('resize', setVh); window.addEventListener('orientationchange', function () { setTimeout(setVh, 250); });

  function getJSON(url, cb) { // XHR instead of fetch for older browsers
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) { try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); } }
      else cb(new Error('HTTP ' + x.status));
    };
    x.onerror = function () { cb(new Error('network')); };
    x.timeout = 15000; x.ontimeout = x.onerror;
    x.send();
  }

  /* ---------- map ---------- */
  if (!window.L) {
    var m = $('mapMsg');
    m.className = 'map-msg on';
    m.innerHTML = 'تعذّر تحميل مكتبة الخرائط.<br>تحقق من اتصالك بالإنترنت ثم أعد تحميل الصفحة.';
    return;
  }

  var KSA_BOUNDS = L.latLngBounds([15.6, 34.4], [32.3, 55.8]);
  var NOM = 'https://nominatim.openstreetmap.org/';
  var map = L.map('map', { zoomControl: false, minZoom: 5, maxZoom: 19, maxBounds: [[14.8, 33.5], [33.2, 56.8]], maxBoundsViscosity: 1.0, worldCopyJump: false, tap: true });
  map.fitBounds(KSA_BOUNDS);
  map.setMinZoom(map.getBoundsZoom(KSA_BOUNDS));
  map.attributionControl.setPrefix(false);

  // OSM's official servers reject requests that carry no HTTP Referer (e.g. a page opened
  // from file://). In that case use OpenStreetMap France's public tiles, which render the same
  // OSM data with local (Arabic) names. On http(s) the official OSM tiles are used.
  var isFile = location.protocol === 'file:';
  var osm = isFile
    ? L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
        subdomains: 'abc', maxZoom: 19,
        attribution: '&copy; OSM'
      })
    : L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; OSM'
      });
  if (isFile) toast('تعمل الصفحة من ملف محلي. للحصول على أفضل أداء شغّلها عبر خادم (http).');
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Esri, Maxar, Earthstar Geographics'
  });
  var current = osm, errCount = 0;
  osm.addTo(map);
  function watchErrors(layer) {
    layer.on('tileerror', function () {
      errCount++;
      if (errCount === 6 && navigator.onLine !== false) toast('تعذّر تحميل بعض أجزاء الخريطة. تحقق من الاتصال.');
    });
    layer.on('load', function () { errCount = 0; });
  }
  watchErrors(osm); watchErrors(sat);

  /* Saudi-only: everything outside the Kingdom's border is masked, and clicks/points outside are rejected.
     The border comes from OSM, is cached on the device, and falls back to a bounding box if unavailable. */
  var ksaRings = null;
  function pip(x, y, r) {
    var c = false, i, j;
    for (i = 0, j = r.length - 1; i < r.length; j = i++) {
      if (((r[i][1] > y) !== (r[j][1] > y)) && (x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0])) c = !c;
    }
    return c;
  }
  function inKSA(ll) {
    if (!KSA_BOUNDS.contains(ll)) return false;
    if (!ksaRings) return true;
    for (var i = 0; i < ksaRings.length; i++) if (pip(ll.lng, ll.lat, ksaRings[i])) return true;
    return false;
  }
  function applyBorder(gj) {
    var polys = gj.type === 'Polygon' ? [gj.coordinates] : (gj.type === 'MultiPolygon' ? gj.coordinates : []);
    if (!polys.length) return;
    ksaRings = polys.map(function (pl) { return pl[0]; });
    var holes = ksaRings.map(function (r) { return r.map(function (c) { return [c[1], c[0]]; }); });
    L.polygon([[[-85, -180], [-85, 180], [85, 180], [85, -180]]].concat(holes), { stroke: false, fillColor: '#e9e6da', fillOpacity: 1, interactive: false }).addTo(map);
    L.geoJSON(gj, { interactive: false, style: { color: '#0b4a3a', weight: 2.5, opacity: .85, dashArray: '8 6', fill: false } }).addTo(map);
  }
  var cachedBorder = null;
  try { cachedBorder = JSON.parse(getLS('ksa_border') || 'null'); } catch (e) {}
  if (cachedBorder) applyBorder(cachedBorder);
  else getJSON(NOM + 'search?format=jsonv2&countrycodes=sa&q=' + encodeURIComponent('المملكة العربية السعودية') + '&featuretype=country&polygon_geojson=1&polygon_threshold=0.005&limit=1&accept-language=ar', function (err, data) {
    if (err || !data || !data[0] || !data[0].geojson) return;
    setLS('ksa_border', JSON.stringify(data[0].geojson));
    applyBorder(data[0].geojson);
  });

  /* ---------- controls ---------- */
  $('zIn').onclick = function () { map.zoomIn(); };
  $('zOut').onclick = function () { map.zoomOut(); };
  $('home').onclick = function () { closePanel(); map.fitBounds(KSA_BOUNDS); };
  $('layer').onclick = function () {
    map.removeLayer(current);
    current = (current === osm) ? sat : osm;
    current.addTo(map);

    b.textContent = DL_BUSY ? 'جارٍ التنزيل…' : ids.length ? 'تنزيل المحدد (' + mbs(t) + ' ميغابايت)' : 'اختر مدينة أو المملكة كاملة';
  }
  function renderRegions(inst, man) {   // the list of packs: downloaded ones + the ones the site offers
    var box = $('rgList'); if (!box) return;
    LAST = { inst: inst, man: man };
    var regs = ((man && man.regions) || []).slice(), known = {}, full = !!inst.ksa, h = '', tot = 0;
    regs.forEach(function (r) { known[r.id] = 1; });
    Object.keys(inst).forEach(function (id) { if (!known[id]) regs.push(inst[id]); });   // downloaded earlier, no longer published
    Object.keys(inst).forEach(function (id) { tot += inst[id].size || 0; });
    if (!regs.length) h = '<div class="hint">' + (navigator.onLine === false ? 'تحتاج اتصالاً بالإنترنت لعرض البيانات المتاحة للتنزيل.' : 'البيانات غير منشورة بعد على الموقع.') + '</div>';
    regs.sort(function (a, b) { return (b.id === 'ksa') - (a.id === 'ksa'); });
    regs.forEach(function (r) {
      var have = inst[r.id], stale = have && r.v && have.v < r.v, covered = full && r.id !== 'ksa' && !have, off = SEL.ksa && r.id !== 'ksa';
      var lead, status = mbs(r.size) + ' ميغابايت';
      if (have && !stale) { lead = '<span class="ok">✓</span>'; status = 'منزّلة · ' + status; }
      else {
        lead = '<input type="checkbox" data-rg="' + r.id + '"' + (SEL[r.id] && !off ? ' checked' : '') + (off || covered ? ' disabled' : '') + '>';
        if (stale) status = 'تحديث متاح · ' + status; else if (covered) status = 'ضمن المملكة كاملة';
      }
      h += '<div class="rg' + (r.id === 'ksa' ? ' full' : '') + '"><label>' + lead + '<span class="rn">' + esc(r.name) + '</span></label><small>' + status + '</small>' +
        (have ? '<button type="button" data-rx="' + r.id + '" aria-label="حذف">&times;</button>' : '') + '</div>';
    });
    box.innerHTML = h; updateSel();
    var sm = $('dsum'); if (sm) sm.textContent = Object.keys(inst).length ? 'المحفوظ على هذا الجهاز: ' + mbs(tot) + ' ميغابايت.' : 'لم تُنزَّل بيانات بعد.';
  }
  function remoteManifest() {   // what the site offers (last copy is kept for when you are offline)
    var old = function () { try { return JSON.parse(getLS('ksa_rman')); } catch (e) { return null; } };
    if (navigator.onLine === false) return Promise.resolve(old());
    return fetch(dataURL('manifest.json') + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('nomanifest'); return r.text(); })
      .then(function (t) { setLS('ksa_rman', t); return JSON.parse(t); }).catch(function () { return old(); });
  }
  function dataStatus() {
    if (!window.caches) { setStat('غير مدعوم في هذا المتصفح.'); return; }
    Promise.all([getInstalled(), remoteManifest()]).then(function (a) { REMOTE = a[1]; renderRegions(a[0], a[1]); });
  }
  function downloadRegions() {
    if (!window.caches || !window.fetch || !window.Promise) { toast('متصفحك لا يدعم التخزين دون إنترنت.'); return; }
    if (navigator.onLine === false) { toast('تحتاج اتصالاً بالإنترنت للتنزيل.'); return; }
    var want = {}; selIds().forEach(function (id) { want[id] = 1; });
    var regs = ((REMOTE && REMOTE.regions) || []).filter(function (r) { return want[r.id]; });
    if (!regs.length || DL_BUSY) return;
    DL_BUSY = true; updateSel();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    var total = 0, n = 0; regs.forEach(function (r) { total += r.files.graph.parts.length + r.files.places.parts.length; });
    setStat('جارٍ البدء…');
    getInstalled().then(function (inst) {
      return caches.open(DATA_CACHE).then(function (c) {
        var ri = 0;
        function nextRegion() {
          if (ri >= regs.length) return;
          var r = regs[ri++], parts = r.files.graph.parts.concat(r.files.places.parts), i = 0;
          delete inst[r.id]; MEM = {};   // not usable until every part of it has arrived
          return putInstalled(c, inst).then(function step() {
            if (i >= parts.length) { inst[r.id] = r; return putInstalled(c, inst); }
            var pn = parts[i++]; n++; setStat('تنزيل «' + r.name + '»: ' + nums(n) + ' / ' + nums(total) + '…');
            return fetch(dataURL(pn), { cache: 'no-store' }).then(function (res) { if (!res.ok) throw new Error('part'); return c.put(dataURL(pn), res); }).then(step);
          }).catch(function (e) { parts.forEach(function (pn) { c.delete(dataURL(pn)); }); throw e; }).then(nextRegion);
        }
        return nextRegion();
      });
    }).then(function () {
      DL_BUSY = false; SEL = {}; MEM = {}; setStat(''); dataStatus(); toast('اكتمل التنزيل. تعمل هذه البيانات الآن دون إنترنت.');
    }, function () {
      DL_BUSY = false; MEM = {}; setStat('تعذّر إكمال التنزيل. ما اكتمل منه محفوظ؛ تحقق من الاتصال وحاول مجدداً.'); dataStatus();
    });
  }
  function deleteRegion(id) {
    getInstalled().then(function (inst) {
      var r = inst[id]; if (!r || !window.confirm('حذف بيانات «' + r.name + '» من هذا الجهاز؟')) return;
      return caches.open(DATA_CACHE).then(function (c) {
        var ps = r.files.graph.parts.concat(r.files.places.parts);
        delete inst[id]; MEM = {};
        return putInstalled(c, inst).then(function () { return Promise.all(ps.map(function (pn) { return c.delete(dataURL(pn)); })); });
      });
    }).then(dataStatus, dataStatus);
  }
  function deleteData() {
    if (!window.caches || !window.confirm('حذف كل بيانات البحث والاتجاهات من هذا الجهاز؟')) return;
    caches.delete(DATA_CACHE).then(function () { DATA.graph = null; DATA.places = null; MEM = {}; SEL = {}; dataStatus(); });
  }
  // ask once, after the first visit, whether to choose offline data (only if it has been published)
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.caches || !window.fetch || navigator.onLine === false || getLS('ksa_asked')) return;
      fetch(dataURL('manifest.json'), { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (!r.ok) return;
        return getInstalled().then(function (have) {
          if (Object.keys(have).length) return; setLS('ksa_asked', '1');
          if (window.confirm('هل تريد اختيار بيانات البحث والاتجاهات لتعمل دون إنترنت؟ يمكنك تنزيل مدن محددة أو المملكة كاملة.')) {
            openSvc(); setTimeout(function () { var e = $('rgList'); if (e && e.scrollIntoView) e.scrollIntoView(); }, 600);
          }
        });
      }).catch(function () {});
    }, 5000);
  });

  /* online / offline status */
  function netState() { $('offl').className = 'pill' + (navigator.onLine === false ? ' on' : ''); }
  window.addEventListener('online', function () { netState(); toast('عاد الاتصال بالإنترنت'); });
  window.addEventListener('offline', function () { netState(); toast('أنت الآن دون اتصال. الخرائط المحفوظة والخدمات المحلية متاحة.'); });
  netState();

  /* register service worker (needs https or localhost) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  /* keep map sized correctly when the viewport changes */
  function refresh() { setTimeout(function () { map.invalidateSize(); map.setMinZoom(map.getBoundsZoom(KSA_BOUNDS)); }, 200); }
  window.addEventListener('resize', refresh);
  window.addEventListener('orientationchange', refresh);
})();
</script>
