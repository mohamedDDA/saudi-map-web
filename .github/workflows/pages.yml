name: Deploy site
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch offline data (if built)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download webdata --repo ${{ github.repository }} --dir dl --pattern 'ksa.graph' --pattern 'places.tsv' || echo "no data release yet"
      - run: python3 tools/make_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4